<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>#251 garden harness (preview)</title>
<style>body{margin:0;background:#cfd8de;font:12px system-ui}#info{position:fixed;left:6px;bottom:6px;background:#fffc;padding:4px 6px;border-radius:4px}</style>
<div id=info>loading</div>
<script type=importmap>{"imports":{"three":"/three/build/three.module.js"}}</script>
<script type=module>
// Harness only: hooks come from window.game.tags if present, else from layout.json via adapter.js. Context walls/floor are drawn here, not by the module.
import * as THREE from 'three';
import { buildDomes, buildGarden, tagsFromLayout } from './index.js';
const q = new URLSearchParams(location.search), tier = q.get('tier') || 'low';
const L = await (await fetch(q.get('layout') || '/layout.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfd3e0);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7a60, 1.3)); const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(-20, 40, 30); scene.add(sun);
const tags = tagsFromLayout(L, THREE, scene, tier);
const ctx = new THREE.Group(), wm = new THREE.MeshStandardMaterial({ color: 0xe6d7c3, side: THREE.DoubleSide, transparent: q.has('cut'), opacity: q.has('cut') ? 0.25 : 1 });
for (const r of tags.rooms.filter(r => r.kind === 'room')) for (let k = 0; k < 6; k++) { const [a, b] = [r.poly[k], r.poly[(k + 1) % 6]], w = new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(b[0] - a[0], b[1] - a[1]), r.wallH, 0.16), wm); w.position.set((a[0] + b[0]) / 2, r.wallH / 2, (a[1] + b[1]) / 2); w.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]); ctx.add(w); }
const art = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x8a4f3a }), tags.art.length); tags.art.forEach((a, i) => art.setMatrixAt(i, new THREE.Matrix4().compose(new THREE.Vector3(a.x + a.ix * 0.09, a.y, a.z + a.iz * 0.09), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.atan2(a.ix, a.iz), 0)), new THREE.Vector3(a.w, a.h, 1)))); ctx.add(art);
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshStandardMaterial({ color: 0xa79f8c })); floor.rotation.x = -Math.PI / 2; ctx.add(floor);
scene.add(ctx);
const domes = buildDomes(tags), garden = buildGarden(tags); scene.add(domes.group, garden.group);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const V = { over: [[0, 70, 55], [0, 0, 0]], court: [[14.6, 1.7, -2.2], [10.5, 0.6, 1.2]], outer: [[-27.5, 2.2, -8], [-32, 0.5, -12.5]], room: null, dome: null };
const r1 = tags.rooms.find(r => r.id === (q.get('room') || 'room-01')), [rx, rz] = r1.center;
V.room = [[rx + 3.5, 1.6, rz - 1.5], [rx - 3, 4.5, rz + 1]]; V.dome = [[rx, 1.6, rz], [rx + 0.2, 9, rz + 0.1]];
const [p, t] = V[q.get('view') || 'over']; camera.position.set(...p); camera.lookAt(...t);
renderer.render(scene, camera); garden.update(1 / 60, null);
const info = { ...renderer.info.render };
const own = (g) => { let n = 0; g.traverse(o => { if (o.isMesh) n++; }); return n; };
window.result = { tier, domeDrawCalls: own(domes.group), gardenDrawCalls: own(garden.group), totalCalls: info.calls, triangles: info.triangles, domeColliders: domes.colliders.length, gardenColliders: garden.colliders.length, colliders: [...domes.colliders, ...garden.colliders], skipped: domes.skipped.length + garden.skipped.length, soundPlaying: garden.sound.playing };
document.getElementById('info').textContent = `#251 garden preview, tier ${tier}: dome meshes ${window.result.domeDrawCalls}, garden meshes ${window.result.gardenDrawCalls}, frame calls ${info.calls}, tris ${info.triangles}`;
window.done = true;
</script>
